name: Generate page rollouts

# Replays benchmark episodes for the project page, including the trained
# policies, whose checkpoints are downloaded from Hugging Face. Each replay is
# checked against results/cache_v2 before the data is committed.

on:
  workflow_dispatch:
  push:
    branches-ignore: [main, gh-pages]
    paths:
      - "docs/scripts/export_rollouts.py"
      - ".github/workflows/page-data.yml"

permissions:
  contents: write

concurrency:
  group: page-data-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rollouts:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          # PuLP 3 removed LpVariable.dicts, which the Oracle and MSSP use.
          pip install -e . stable-baselines3 "pulp<3"

      - name: Download checkpoints
        run: bash download_weights.sh

      - name: Export and verify rollouts
        run: python docs/scripts/export_rollouts.py --require-ml --verify

      - name: Commit updated rollouts
        if: github.ref != 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/rollouts
          if git diff --cached --quiet; then
            echo "Rollout data unchanged."
            exit 0
          fi
          git commit -m "Regenerate page rollouts with trained policies"
          git push

      - name: Upload rollouts
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: page-rollouts
          path: docs/data/rollouts
