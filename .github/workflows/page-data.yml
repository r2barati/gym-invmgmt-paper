name: Generate page data

# Regenerates everything in docs/data/ from the canonical results: the
# leaderboard, the topologies and the rollouts, which replay benchmark episodes
# including the trained policies (checkpoints are downloaded from Hugging Face).
# Each replay is checked against results/cache_v2 and the whole data set is
# validated before it is committed back to the branch. On main, which this
# workflow does not push to, run it manually and the data is uploaded as an
# artifact instead.

on:
  workflow_dispatch:
  push:
    branches-ignore: [main, gh-pages]
    paths:
      - "results/**"
      - "benchmarks/run_benchmarks.py"
      - "gym_invmgmt/topologies/**"
      - "docs/scripts/**"
      - ".github/workflows/page-data.yml"

permissions:
  contents: write

concurrency:
  group: page-data-${{ github.ref }}
  cancel-in-progress: true

jobs:
  page-data:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[or]" stable-baselines3

      - name: Download checkpoints
        run: bash download_weights.sh

      - name: Export page data
        run: |
          python docs/scripts/export_leaderboard.py
          python docs/scripts/export_topologies.py
          python docs/scripts/export_rollouts.py --require-ml --verify

      - name: Check page data against the results
        run: python docs/scripts/check_site_data.py

      - name: Commit updated page data
        if: github.ref != 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "Page data unchanged."
            exit 0
          fi
          git commit -m "Regenerate project page data"
          git push

      - name: Upload page data
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: page-data
          path: docs/data
