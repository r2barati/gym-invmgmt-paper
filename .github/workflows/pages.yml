name: Deploy project page

# Deploys docs/ as is, after checking that its data agrees with the canonical
# results. A push that changes the results, the benchmark runner or the
# environment without regenerating the page data fails here instead of
# publishing a stale page; regenerate it with page-data.yml.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "results/**"
      - "benchmarks/run_benchmarks.py"
      - "gym_invmgmt/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Check page data against the results
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          python docs/scripts/check_site_data.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deployment
        uses: actions/deploy-pages@v4
